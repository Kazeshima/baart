[package]
name = "baart"
version = "1.1.5"
description = "Blue Archive Arena Rating Tool"
authors = ["Kazeshima"]
edition = "2021"
rust-version = "1.77.2"

[package.metadata.bundle]
name = "BAART"
identifier = "com.kazeshima.baart"

[lib]
name = "baart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloc-no-stdlib = "=2.0.4"
rfd = "0.15"
