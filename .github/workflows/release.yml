name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.1"
        required: true
        default: "v1.1.1"
      draft:
        description: "Create a draft release"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run build
          npm run video:compositions
          npm run renderer:smoke
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: BAART ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            BAART Windows x64 release.

            This build includes the standalone Remotion renderer runtime, generated local school icons, Windows installers, and a portable standalone executable.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Prepare portable executable asset
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $source = "src-tauri/target/x86_64-pc-windows-msvc/release/baart.exe"
          if (!(Test-Path $source)) {
            $source = "src-tauri/target/release/baart.exe"
          }
          if (!(Test-Path $source)) {
            throw "Portable executable not found in target release directories"
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $source "release-assets/BAART-$tag-windows-x64-portable.exe"

      - name: Upload portable executable
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          files: release-assets/BAART-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows-x64-portable.exe
