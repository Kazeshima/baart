name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.2"
        required: true
        default: "v1.1.2"
      draft:
        description: "Create a draft release"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run build
          npm run video:compositions
          npm run renderer:smoke
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: BAART ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            BAART Windows x64 release.

            This build includes the standalone Remotion renderer runtime, generated local school icons, Windows installers, and a portable ZIP bundle with the executable plus required renderer resources.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Prepare portable bundle asset
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $candidateRoots = @(
            "src-tauri/target/x86_64-pc-windows-msvc/release",
            "src-tauri/target/release"
          )
          $releaseRoot = $candidateRoots | Where-Object { Test-Path (Join-Path $_ "baart.exe") } | Select-Object -First 1
          if (!$releaseRoot) {
            throw "Portable executable not found in target release directories"
          }
          $required = @(
            "baart.exe",
            "baart-node.exe",
            "renderer/app/video/sidecar/worker.mjs",
            "renderer/composition",
            "renderer/app/node_modules/@remotion/compositor-win32-x64-msvc"
          )
          foreach ($relative in $required) {
            $path = Join-Path $releaseRoot $relative
            if (!(Test-Path $path)) {
              throw "Portable runtime is incomplete; missing $path"
            }
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $portableRoot = "release-assets/BAART-$tag-windows-x64-portable"
          Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $releaseRoot "baart.exe") -Destination $portableRoot
          Copy-Item -LiteralPath (Join-Path $releaseRoot "baart-node.exe") -Destination $portableRoot
          Copy-Item -LiteralPath (Join-Path $releaseRoot "renderer") -Destination $portableRoot -Recurse
          if (Test-Path (Join-Path $releaseRoot "resources")) {
            Copy-Item -LiteralPath (Join-Path $releaseRoot "resources") -Destination $portableRoot -Recurse
          }
          @"
          BAART portable bundle

          Keep baart.exe, baart-node.exe, and the renderer folder together.
          Video Studio rendering and benchmarking will fail if baart.exe is copied out by itself.
          "@ | Set-Content -Path (Join-Path $portableRoot "README-portable.txt") -Encoding UTF8
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "release-assets/BAART-$tag-windows-x64-portable.zip" -Force

      - name: Upload portable bundle
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          files: release-assets/BAART-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows-x64-portable.zip
